name = "api-flow"
main = "src/index.ts"
compatibility_date = "2026-04-15"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
strict_port = true

# 10 Million Requests / month
# Cloudflare Workers Standard Pricing now automatically applies unbound limits
# to cron fetch loops without needing to specify usage_model.
# We strictly bind R2 here isolated from the DB app for clean separation
[[r2_buckets]]
binding = "FLOW_STORAGE"
bucket_name = "flowdata"

# Optional: Bind D1 dynamically if we need to query rivers mapping
[[d1_databases]]
binding = "DB"
database_name = "rivers-db"
database_id = "d52e56f5-d59f-4e59-b2e0-7b8b7a8dde71"

# Flow history store (see AGENTS.md). Separate from rivers-db so ingest writes
# never contend with user CRUD.
[[d1_databases]]
binding = "FLOW_DB"
database_name = "flow-db"
database_id = "bfdbdd5a-5626-4593-98f6-927ba2f682a4"

# Forecast model container (src/services/flowModel.ts). One instance, run by
# the hourly FORECAST_CRON; it reaches R2 only through the Worker. The image is
# built in flow_predictions (serving/) and pushed to Cloudflare's registry,
# tagged with that repo's commit; see AGENTS.md to update it.
[[containers]]
class_name = "FlowModel"
image = "registry.cloudflare.com/55098d8696658ea1ee4ec73ae57d1741/flow-serving:78d6d3e"
max_instances = 1
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "FLOW_MODEL"
class_name = "FlowModel"

[[migrations]]
tag = "v1-flow-model"
new_sqlite_classes = ["FlowModel"]

[[routes]]
pattern = "flow.rivers.run"
custom_domain = true

# Cron work (USGS sweeps, backfill, model snapshot) can exceed the 30s default.
[limits]
cpu_ms = 300000

# Cron triggers for background polling
# 1. 15-minute gauge polling
# 2. Daily maintenance, and weekly full registry recompilation (every Friday)
# 3. Hourly forecast model run (FORECAST_CRON in src/index.ts)
[triggers]
crons = ["*/15 * * * *", "0 0 * * *", "0 0 * * 5", "10 * * * *"]
